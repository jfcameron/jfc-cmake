name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: modules (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: parse_arguments
        run: cmake -Wno-deprecated -P test/parse_arguments_test.cmake

      - name: integration (jfc_add_tests)
        run: |
          cmake -S test/integration -B "${{ runner.temp }}/jfc-integration" -Wno-deprecated
          cmake --build "${{ runner.temp }}/jfc-integration" --config Debug
          ctest --test-dir "${{ runner.temp }}/jfc-integration" -C Debug --output-on-failure

      - name: toolchain-linux-cross
        run: cmake -Wno-deprecated -P test/toolchain_linux_cross_test.cmake

  cross:
    name: integration on ${{ matrix.triple }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        triple: [arm-linux-gnueabihf, s390x-linux-gnu]

    steps:
      - uses: actions/checkout@v7

      - name: install
        run: sudo apt-get update && sudo apt-get install -y g++-${{ matrix.triple }} qemu-user

      - name: integration (jfc_add_tests), cross compiled
        run: |
          cmake -S test/integration -B "${{ runner.temp }}/jfc-integration" -Wno-deprecated \
              --toolchain "$PWD/toolchains/toolchain-linux-cross.cmake" -DJFC_CROSS_TRIPLE=${{ matrix.triple }}
          cmake --build "${{ runner.temp }}/jfc-integration" --config Debug
          ctest --test-dir "${{ runner.temp }}/jfc-integration" -C Debug --output-on-failure

  documentation:
    name: sphinx
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: install sphinx and the cmake domain
        run: pip install sphinx sphinxcontrib-moderncmakedomain

      - name: generate, warnings are errors
        run: sphinx-build -W --keep-going -b html docs "${{ runner.temp }}/docs"

      - name: upload for github pages
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/docs

  pages:
    name: publish to github pages
    needs: documentation
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
